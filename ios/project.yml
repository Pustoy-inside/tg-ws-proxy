name: TGWSProxy
options:
  bundleIdPrefix: com.pustoyinside
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  TGWSProxy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist"]
      - Shared
      - Engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pustoyinside.tgwsproxy
        PRODUCT_NAME: TGWSProxy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TG Proxy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationQueriesSchemes: [tg]
        UILaunchScreen: {}
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: "Геолокация нужна только для того, чтобы iOS не останавливала прокси в фоне, пока ты в Telegram. Координаты никуда не передаются."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Геолокация нужна только для того, чтобы iOS не останавливала прокси в фоне, пока ты в Telegram. Координаты никуда не передаются."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

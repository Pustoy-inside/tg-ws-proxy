name: TGWSProxy
options:
  bundleIdPrefix: com.pustoyinside
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  TGWSProxy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
      - Shared
    dependencies:
      - target: Tunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pustoyinside.tgwsproxy
        PRODUCT_NAME: TGWSProxy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TG Proxy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationQueriesSchemes: [tg]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  Tunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes: ["Info.plist", "*.entitlements"]
      - Shared
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pustoyinside.tgwsproxy.tunnel
        PRODUCT_NAME: Tunnel
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
